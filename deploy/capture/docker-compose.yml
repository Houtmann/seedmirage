# Real BitTorrent clients for capture mode: one client at a time, through compose profiles.
#
#   seedmirage capture --listen 0.0.0.0:6969 --announce-host host.docker.internal:6969 --out ./capture
#   docker compose -f deploy/capture/docker-compose.yml --profile qbittorrent up -d
#
# The capture tracker runs on the host; the containers reach it through host.docker.internal
# (extra_hosts below). 0.0.0.0 exposes the tracker on every host interface:
# prefer the Docker bridge address (e.g. --listen 172.17.0.1:6969) or a firewall, and stop
# the capture afterwards. See docs/capture.md.
#
# Pinned versions: a capture describes ONE precise client version. The tags below
# could not be verified when this was written (no Docker daemon available):
# check that they exist and that `docker compose ... logs` reports the expected version,
# then adjust the tag AND the name of the resulting profile.
#
# The fake torrents have no data: the client shows up as a leecher (left > 0).
# In each client, add the .torrent files from ./capture WITHOUT starting a file check
# or a real download.

x-capture-client: &client
  restart: "no"
  extra_hosts:
    - "host.docker.internal:host-gateway"
  environment: &env
    PUID: "1000"
    PGID: "1000"
    TZ: "Etc/UTC"

services:
  qbittorrent:
    <<: *client
    profiles: ["qbittorrent"]
    image: lscr.io/linuxserver/qbittorrent:${QBITTORRENT_TAG:-5.3.0}   # 4.6.7 : QBITTORRENT_TAG=4.6.7-libtorrentv1
    environment:
      <<: *env
      WEBUI_PORT: "8080"
    ports:
      - "127.0.0.1:8080:8080"   # web UI: add the .torrent files here
    volumes:
      - ./config/qbittorrent:/config
      - ../../capture:/torrents:ro

  transmission:
    <<: *client
    profiles: ["transmission"]
    image: lscr.io/linuxserver/transmission:${TRANSMISSION_TAG:-4.1.4}   # 3.00 : TRANSMISSION_TAG=version-3.00-r8
    ports:
      - "127.0.0.1:9091:9091"
    volumes:
      - ./config/transmission:/config
      - ../../capture:/watch   # watch folder: .torrent files are added automatically

  deluge:
    <<: *client
    profiles: ["deluge"]
    image: lscr.io/linuxserver/deluge:2.2.0
    environment:
      <<: *env
      DELUGE_LOGLEVEL: "error"
    ports:
      - "127.0.0.1:8112:8112"
    volumes:
      - ./config/deluge:/config
      - ../../capture:/torrents:ro

  rtorrent:
    <<: *client
    profiles: ["rtorrent"]
    # No linuxserver.io image for rTorrent alone: community image, check the tag.
    image: crazymax/rtorrent-rutorrent:5.3.18-0.16.25
    ports:
      - "127.0.0.1:8081:8080"   # ruTorrent (RPC2 compris)
    volumes:
      - ./config/rtorrent:/data
      # Watched folder: ./config/rtorrent/rtorrent/watch (scripts/capture/rtorrent.sh copies the .torrent files there).
