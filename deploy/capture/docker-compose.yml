# Clients BitTorrent réels pour le mode capture : un client à la fois, via les profils compose.
#
#   seedmirage capture --listen 0.0.0.0:6969 --announce-host host.docker.internal:6969 --out ./capture
#   docker compose -f deploy/capture/docker-compose.yml --profile qbittorrent up -d
#
# Le tracker de capture tourne sur l'hôte ; les conteneurs le joignent par host.docker.internal
# (extra_hosts ci-dessous). 0.0.0.0 expose le tracker sur toutes les interfaces de l'hôte :
# préférer l'adresse du pont Docker (ex. --listen 172.17.0.1:6969) ou un pare-feu, et arrêter
# la capture ensuite. Voir docs/capture.md.
#
# Versions épinglées : une capture décrit UNE version précise du client. Les tags ci-dessous
# n'ont pas pu être vérifiés au moment de l'écriture (pas d'accès à un daemon Docker) :
# contrôler qu'ils existent et que `docker compose ... logs` annonce bien la version attendue,
# puis ajuster le tag ET le nom du profil produit.
#
# Les torrents factices n'ont aucune donnée : le client apparaît comme leecher (left > 0).
# Dans chaque client, ajouter les .torrent de ./capture SANS lancer de vérification de
# fichiers ni de téléchargement réel.

x-capture-client: &client
  restart: "no"
  extra_hosts:
    - "host.docker.internal:host-gateway"
  environment: &env
    PUID: "1000"
    PGID: "1000"
    TZ: "Etc/UTC"

services:
  qbittorrent:
    <<: *client
    profiles: ["qbittorrent"]
    image: lscr.io/linuxserver/qbittorrent:${QBITTORRENT_TAG:-5.3.0}   # 4.6.7 : QBITTORRENT_TAG=4.6.7-libtorrentv1
    environment:
      <<: *env
      WEBUI_PORT: "8080"
    ports:
      - "127.0.0.1:8080:8080"   # interface web : ajouter les .torrent ici
    volumes:
      - ./config/qbittorrent:/config
      - ../../capture:/torrents:ro

  transmission:
    <<: *client
    profiles: ["transmission"]
    image: lscr.io/linuxserver/transmission:${TRANSMISSION_TAG:-4.1.4}   # 3.00 : TRANSMISSION_TAG=version-3.00-r8
    ports:
      - "127.0.0.1:9091:9091"
    volumes:
      - ./config/transmission:/config
      - ../../capture:/watch   # dépôt automatique des .torrent

  deluge:
    <<: *client
    profiles: ["deluge"]
    image: lscr.io/linuxserver/deluge:2.2.0
    environment:
      <<: *env
      DELUGE_LOGLEVEL: "error"
    ports:
      - "127.0.0.1:8112:8112"
    volumes:
      - ./config/deluge:/config
      - ../../capture:/torrents:ro

  rtorrent:
    <<: *client
    profiles: ["rtorrent"]
    # Pas d'image linuxserver.io pour rTorrent seul : image communautaire, tag à vérifier.
    image: crazymax/rtorrent-rutorrent:5.3.18-0.16.25
    ports:
      - "127.0.0.1:8081:8080"   # ruTorrent (RPC2 compris)
    volumes:
      - ./config/rtorrent:/data
      # Dossier surveillé : ./config/rtorrent/rtorrent/watch (scripts/capture/rtorrent.sh y copie les .torrent).
