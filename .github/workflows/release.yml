name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
          install-only: true
      - name: Install Tailwind (pinned sha256)
        run: make tools
      - name: Version from tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          case "$version" in
            *-*) echo "PRERELEASE=true" >> "$GITHUB_ENV" ;;
            *) echo "PRERELEASE=false" >> "$GITHUB_ENV" ;;
          esac
      - name: Check
        run: make check
      - name: Build archives and checksums
        run: make dist VERSION="$VERSION"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Image tags
        id: tags
        run: |
          tags="ghcr.io/houtmann/seedmirage:${VERSION}"
          # Pre-releases (version with a suffix) never move :latest.
          if [ "$PRERELEASE" != "true" ]; then tags="${tags},ghcr.io/houtmann/seedmirage:latest"; fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
      - name: Build and push the multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ env.VERSION }}
          tags: ${{ steps.tags.outputs.tags }}
      # Last step: the release only becomes visible once the archives and the image are published.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flag=""
          if [ "$PRERELEASE" = "true" ]; then flag="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.zip dist/SHA256SUMS \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag $flag
