# seedmirage locally: builds the image from the sources, UI on http://127.0.0.1:7070 only.
#
#   mkdir -p data                      # create it yourself (otherwise Docker creates it as root)
#   docker compose up -d --build
#   docker compose logs seedmirage | grep token    # access link
#   docker compose down                # sends the `stopped` announces (15 s at most)
#
# Variables (a .env file next to this compose file, see .env.example, or the environment):
#   SEEDMIRAGE_IMAGE      name of the built image (default seedmirage:local)
#   SEEDMIRAGE_VERSION    version injected in the binary (default dev)
#   SEEDMIRAGE_UID/GID    host UID/GID for the files in ./data (default 1000:1000; `id -u`, `id -g`)
#   SEEDMIRAGE_UI_TOKEN   fixes the access token (>= 32 characters: openssl rand -hex 32); otherwise data/ui-token
#   TZ                    time zone (default Etc/UTC)
#   SEEDMIRAGE_LOG_FORMAT json (default in the container) or text
name: seedmirage
services:
  seedmirage:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        VERSION: ${SEEDMIRAGE_VERSION:-dev}
    image: ${SEEDMIRAGE_IMAGE:-seedmirage:local}
    # Create ./data with this same UID/GID before the first start (otherwise Docker creates it as root).
    user: "${SEEDMIRAGE_UID:-1000}:${SEEDMIRAGE_GID:-1000}"
    restart: unless-stopped
    stop_grace_period: 15s
    ports:
      - "127.0.0.1:7070:7070"
    volumes:
      - ./data:/data
    environment:
      TZ: ${TZ:-Etc/UTC}
      SEEDMIRAGE_LOG_FORMAT: ${SEEDMIRAGE_LOG_FORMAT:-json}
      SEEDMIRAGE_UI_TOKEN: ${SEEDMIRAGE_UI_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
